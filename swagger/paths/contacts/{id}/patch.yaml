# swagger/paths/students/{id}/patch.yaml
tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: 'Update contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  description: 'Data to update the contact'
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: John Doe
          email:
            type: string
            example: johndoe@example.com
          phone:
            type: string
            example: '+380631578376'
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            example: personal
responses:
  '200':
    description: 'Successfully updated contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact with id 65ca67e7ae7f10c88b598384!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  
  '404':
    $ref: '../../../components/responses/404.yaml'
