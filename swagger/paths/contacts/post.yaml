# swagger/paths/students/post.yaml
tags:
  - Contacts
summary: Add a new contact
operationId: createContact
description: 'Create a new contact'
security:
  - bearerAuth: []
requestBody:
  description: 'Data required to create a new contact'
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
          - phoneNumber
          
        properties:
          name:
            type: string
            example: "John Doe"
          email:
            type: string
            format: email
            example: johndoe@example.com
          phoneNumber:
            type: string
            example: '+380631578376'
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            default: personal
responses:
  '201':
    description: 'Contact successfully created'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '400':
    description: 'Bad Request - Invalid input data'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid input data
  '401':
    description: 'Unauthorized - Authentication is required'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Authentication is required to create a contact
  '500':
    description: 'Internal Server Error'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: An error occurred on the server
