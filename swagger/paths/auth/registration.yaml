tags:
  - Authentication
summary: User Registration
operationId: userRegistration
description: 'Register a new user and return a success message'
security:
  - bearerAuth: []  # Определяем схему безопасности для всего API
requestBody:
  description: 'User registration details'
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
            example: 'johndoe'
          email:
            type: string
            format: email
            example: 'johndoe@example.com'
          password:
            type: string
            format: password
            example: 'password123'
responses:
  '201':
    description: 'User successfully registered'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'User registered successfully'
  '400':
    description: 'Bad request - Missing or invalid parameters'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: 'Invalid data provided'
  '409':
    description: 'Conflict - Username or email already exists'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 409
            message:
              type: string
              example: 'Username or email already exists'
  '500':
    description: 'Internal server error'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: 'An error occurred on the server'
