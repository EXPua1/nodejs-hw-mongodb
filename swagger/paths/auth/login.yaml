tags:
      - Authentication
summary: User Login
operationId: userLogin
description: 'Authenticate a user and return a JWT token'
security: []  # Логин может быть без авторизации
requestBody:
      description: 'User login credentials'
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - password
            properties:
              email:
                type: string
                example: 'johndoe@example.com'
              password:
                type: string
                format: password
                example: 'password123'
responses:
      '200':
        description: 'Login successful, returns JWT token'
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - message
                - token
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: 'Authentication successful'
                token:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'
      '400':
        description: 'Bad request - Invalid credentials'
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 400
                message:
                  type: string
                  example: 'Invalid username or password'
      '401':
        description: 'Unauthorized - Authentication failed'
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 401
                message:
                  type: string
                  example: 'Authentication required'
      '500':
        description: 'Internal server error'
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 500
                message:
                  type: string
                  example: 'An error occurred on the server'

